---
# Ansible Bootstrap Configuration for Control Host
- name: Bootstrap Ansible Control Host
  hosts: ansible_controller
  become: true
  gather_facts: true

  tasks:
      - name: Update apt cache
        apt:
            update_cache: yes
            cache_valid_time: 3600
        when: ansible_os_family == "Debian"

      - name: Install required packages
        package:
            name:
                - python3
                - python3-pip
                - git
                - sshpass
                - python3-venv
            state: present

      - name: Install Ansible using pip
        pip:
            name: ansible
            state: latest
