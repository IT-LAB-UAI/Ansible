---
- name: Debug Rook-Ceph cluster.yaml generation only
  hosts: main_control_plane
  become: true
  gather_facts: false
  vars_files:
      - secrets_k8s.yml

  tasks:
      - name: Create Rook-Ceph manifest directory (if not exists)
        file:
            path: /root/rook-ceph
            state: directory
            mode: "0755"

      - name: Get Kubernetes node hostnames
        shell: kubectl get nodes -o jsonpath='{.items[*].metadata.name}'
        register: kube_node_names
        changed_when: false

      - name: Set fact for rook_ceph_nodes
        set_fact:
            rook_ceph_nodes: "{{ kube_node_names.stdout.split() }}"

      - name: Render rook-ceph cluster.yaml from template (only generate)
        template:
            src: ../Templates/cluster.yaml.j2
            dest: /root/rook-ceph/cluster.yaml
            mode: "0644"

      - name: Show generated cluster.yaml content
        shell: cat /root/rook-ceph/cluster.yaml
        register: rendered_yaml

      - name: Output cluster.yaml for review
        debug:
            msg: "{{ rendered_yaml.stdout }}"
