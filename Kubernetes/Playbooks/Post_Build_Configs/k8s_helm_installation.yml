---
- name: Install Helm on Kubernetes Control Plane
  hosts: main_control_plane:control_plane
  become: true
  gather_facts: yes
  vars_files:
      - ../secrets_k8s.yml
  vars:
      helm_version: "3.16.2"
      helm_archive: "helm-v{{ helm_version }}-linux-amd64.tar.gz"
      helm_download_url: "https://get.helm.sh/{{ helm_archive }}"
      helm_temp_path: "/tmp/{{ helm_archive }}"
      helm_install_path: "/usr/local/bin"
  tasks:
      - name: Ensure required packages are installed
        apt:
            name:
                - curl
                - tar
                - bash-completion
            state: present
            update_cache: yes

      - name: Check if Helm is already installed
        command: helm version --short
        register: helm_installed
        failed_when: false
        changed_when: false

      - name: Display current Helm version if installed
        debug:
            msg: "Helm is already installed: {{ helm_installed.stdout }}"
        when: helm_installed.rc == 0

      - name: Download Helm archive
        get_url:
            url: "{{ helm_download_url }}"
            dest: "{{ helm_temp_path }}"
            mode: "0644"
        when: helm_installed.rc != 0

      - name: Extract Helm binary
        unarchive:
            src: "{{ helm_temp_path }}"
            dest: "/tmp"
            remote_src: yes
            creates: "/tmp/linux-amd64/helm"
        when: helm_installed.rc != 0

      - name: Move Helm binary to system path
        copy:
            src: "/tmp/linux-amd64/helm"
            dest: "{{ helm_install_path }}/helm"
            mode: "0755"
            remote_src: yes
        when: helm_installed.rc != 0

      - name: Clean up temporary files
        file:
            path: "{{ item }}"
            state: absent
        loop:
            - "{{ helm_temp_path }}"
            - "/tmp/linux-amd64"
        when: helm_installed.rc != 0

      - name: Verify Helm installation
        command: helm version --short
        register: helm_version_output
        changed_when: false

      - name: Display installed Helm version
        debug:
            msg: "Helm version installed: {{ helm_version_output.stdout }}"

      - name: Generate Helm completion script
        shell: helm completion bash > /etc/bash_completion.d/helm
        args:
            creates: /etc/bash_completion.d/helm

      - name: Add Helm repositories (stable)
        command: helm repo add stable https://charts.helm.sh/stable
        register: helm_repo_stable
        failed_when: false
        changed_when: "'has been added' in helm_repo_stable.stdout"

      - name: Add Helm repositories (bitnami)
        command: helm repo add bitnami https://charts.bitnami.com/bitnami
        register: helm_repo_bitnami
        failed_when: false
        changed_when: "'has been added' in helm_repo_bitnami.stdout"

      - name: Update Helm repositories
        command: helm repo update
        changed_when: false

      - name: Enable Helm autocompletion in bashrc
        blockinfile:
            path: /root/.bashrc
            create: yes
            marker: "# {mark} ANSIBLE MANAGED BLOCK - helm"
            block: |
                # Load bash completion for Helm
                if [ -f /etc/bash_completion.d/helm ]; then
                    . /etc/bash_completion.d/helm
                fi

      - name: Set KUBECONFIG environment variable in bashrc
        lineinfile:
            path: /root/.bashrc
            line: "export KUBECONFIG=/etc/kubernetes/admin.conf"
            state: present
            create: yes
