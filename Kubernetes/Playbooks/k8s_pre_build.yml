---
- name: Delete swap partition and configure host for Kubernetes
  hosts: all
  become: yes
  become_method: su
  become_user: root

  vars_files:
      - "secrets_k8s.yml"

  tasks:
      - name: Disable swap
        command: /sbin/swapoff -a

      - name: Ensure parted and util linux is installed
        apt:
            name:
                - parted
                - util-linux
            state: present
            update_cache: yes

      - name: Get partition information
        parted:
            device: /dev/nvme0n1
            unit: MiB
        register: disk_info

      - name: Display current partition information
        debug:
            var: disk_info.partitions

      - name: Find swap partition
        set_fact:
            swap_partition: "{{ item }}"
        loop: "{{ disk_info.partitions }}"
        when: item.flags is defined and 'swap' in item.flags
        register: swap_find_result

      - name: Delete swap partition
        parted:
            device: /dev/nvme0n1
            number: "{{ swap_partition.num }}"
            state: absent
        when: swap_find_result.results | selectattr('ansible_facts', 'defined') | list | length > 0

      - name: Remove swap entry from fstab
        lineinfile:
            path: /etc/fstab
            regexp: ".*swap.*"
            state: absent

      - name: Remove extended partition if it exists
        parted:
            device: /dev/nvme0n1
            number: 2
            state: absent
        ignore_errors: yes
        register: extended_removed

      - name: Remove logical partition (swap) if it exists
        parted:
            device: /dev/nvme0n1
            number: 5
            state: absent
        ignore_errors: yes
        register: logical_removed

      - name: Update partition information after removing extended partition
        parted:
            device: /dev/nvme0n1
            unit: MiB
        register: updated_disk_info
        when: extended_removed is defined and not extended_removed.failed

      - name: Display updated partition information
        debug:
            var: updated_disk_info.partitions
        when: extended_removed is defined and not extended_removed.failed and updated_disk_info is defined

      - name: Get updated partition information for free space analysis
        parted:
            device: /dev/nvme0n1
            unit: MiB
        register: free_space_info

      - name: Determine start point for new partition
        set_fact:
            new_partition_start: "{{ free_space_info.partitions | map(attribute='end') | max | float | round + 1 }}"

      - name: Create new primary partition with remaining space
        parted:
            device: /dev/nvme0n1
            number: 2
            state: present
            part_type: primary
            unit: MiB
            part_start: "{{ new_partition_start | string }}MiB"
            part_end: "100%"
        become: yes

      - name: Wipe old filesystem signatures from the new partition
        shell: /usr/sbin/wipefs --all /dev/nvme0n1p2
        become: yes
